services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: zeitgeist
    ports:
      - "5432:5432"
    volumes:
      - zeitgeist_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/zeitgeist
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS_CSV: http://localhost:3000,http://127.0.0.1:3000
      # Set API keys in your local .env (docker compose will load it automatically if present)
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/zeitgeist
      REDIS_URL: redis://redis:6379/0
    command: ["bash", "-lc", "celery -A app.worker.celery_app.celery_app worker -l info"]
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  zeitgeist_pg: {}

